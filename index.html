<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      window.addEventListener('error', function(event) {
        alert('JS Runtime Error:\n' + event.message + '\n\nFile: ' + event.filename + '\nLine: ' + event.lineno);
      });
      window.addEventListener('unhandledrejection', function(event) {
        alert('Promise Rejection:\n' + (event.reason ? (event.reason.message || event.reason) : 'Unknown reason'));
      });
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Automated, tablet-optimized facial recognition attendance system for HND schools in Haryana. Built-in analytics, mid-day meal planning, and automated reporting." />
    <title>HND Facial Attendance System - Haryana Education Dept</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Load face-api.js from CDN BEFORE React bundle — avoids Vite/TF bundling issues -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
